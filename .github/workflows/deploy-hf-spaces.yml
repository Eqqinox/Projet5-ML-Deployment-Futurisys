# Nom du workflow affiché dans l'interface GitHub Actions
name: Deploy to Hugging Face Spaces

# Définit les événements déclencheurs du workflow
on:
  push:
    branches: [ main, develop ] # Se déclenche lors d'un push sur main ou develop
  pull_request:
    branches: [ main ] # Se déclenche lors d'une Pull request (PR) vers main

jobs:
  # Job de tests préalables (obligatoire avant déploiement)
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4   # Télécharge le code source du repository
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4   # Configure l'environnement Python
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

# Ajoute le répertoire courant au PATH (sys.path..)
# Teste l'import de l'app FastAPI (from app.main import app)
    - name: Test FastAPI app loads
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')      
        try:
            from app.main import app
            print('✅ FastAPI app loads successfully')
            print('✅ All imports working')
        except Exception as e:
            print(f'❌ Error: {e}')
            raise
        "

 # Job de déploiement en environnement développement
  deploy-dev:
    needs: test     # Attend la réussite du job 'test'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true         # Active Git LFS pour les gros fichiers (modèles ML)
    
    - name: Deploy to Development
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}       # Token Hugging Face depuis les secrets GitHub
      run: |
        echo "Deploying to DEVELOPMENT environment"

        # Configuration Git pour les commits automatiques
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # Clone du Space Hugging Face dans un dossier temporaire
        git clone https://huggingface.co/spaces/Eqqinox/futurisys-ml-api hf-space
        cd hf-space
        
        # NETTOYAGE: Suppression complète du contenu existant pour éviter app/app/
        rm -rf app/ || true
        rm -f Dockerfile hf_app.py requirements.txt README.md || true
        
        # Copier tous les fichiers nécessaires depuis Github
        cp ../Dockerfile .
        cp ../hf_app.py .
        cp ../requirements.txt .
        cp ../README.md .
        
        # COPIE PROPRE: Copie complète du code source de l'API
        cp -r ../app .
        
        # Vérifier que app/ est bien copié
        echo "Contenu après copie:"
        ls -la
        echo "Contenu de app/:"
        ls -la app/ || echo "app/ directory not found after copy"
        echo "Vérification health.py:"
        cat app/routers/health.py | head -15
        
        # Commit et push vers Hugging Face
        git add .
        git commit -m "Deploy to DEV: ${{ github.sha }}" || exit 0
        git push https://Eqqinox:$HF_TOKEN@huggingface.co/spaces/Eqqinox/futurisys-ml-api main

# Job de déploiement en environnement production (identique à dev)        
  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true     # Git LFS pour les modèles ML
    
    - name: Deploy to Production
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}       # Token d'authentification Hugging Face
      run: |
        echo "Deploying to PRODUCTION environment"
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        git clone https://huggingface.co/spaces/Eqqinox/futurisys-ml-api hf-space
        cd hf-space
        
        # NETTOYAGE: Suppression complète du contenu existant pour éviter app/app/
        rm -rf app/ || true
        rm -f Dockerfile hf_app.py requirements.txt README.md || true
        
        # Copier tous les fichiers nécessaires
        cp ../Dockerfile .
        cp ../hf_app.py .
        cp ../requirements.txt .
        cp ../README.md .
        
        # COPIE PROPRE: Copier le dossier app/ complet
        cp -r ../app .
        
        # Vérifier que app/ est bien copié
        echo "Contenu après copie:"
        ls -la
        echo "Contenu de app/:"
        ls -la app/ || echo "app/ directory not found after copy"
        echo "Vérification health.py:"
        cat app/routers/health.py | head -15
        
        # Déploiement en production
        git add .
        git commit -m "Deploy to PROD: ${{ github.sha }}" || exit 0
        git push https://Eqqinox:$HF_TOKEN@huggingface.co/spaces/Eqqinox/futurisys-ml-api main