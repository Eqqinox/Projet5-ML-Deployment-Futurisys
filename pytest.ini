[tool:pytest]
# Répertoires de tests
testpaths = tests

# Fichiers de tests reconnus
python_files = test_*.py

# Fonctions de test reconnues
python_functions = test_*

# Classes de test reconnues
python_classes = Test*

# Options par défaut
addopts = 
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --tb=short
    -v
    --strict-markers
    --disable-warnings

# Marqueurs personnalisés
markers =
    slow: tests lents (>5s)
    integration: tests d'intégration end-to-end
    performance: tests de performance et charge
    edge_cases: tests de cas limites
    unit: tests unitaires
    api: tests des endpoints API
    ml: tests du modèle ML

# Configuration de couverture
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */migrations/*
    app/database/migrations/*
    app/__init__.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
title = Projet5 ML Deployment - Coverage Report